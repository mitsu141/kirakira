<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    世界の雑学 Shorts Generator
  </title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>

<body>

  <div class="container">

    <h1>
      世界の雑学 Shorts Generator
    </h1>

    <textarea
      id="scriptInput"
      placeholder="1行ごとに入力してください"
    ></textarea>

    <button id="generateBtn">
      動画生成
    </button>

    <video
      id="preview"
      controls
    ></video>

    <a
      id="downloadBtn"
      download="shorts.mp4"
    >
      動画をダウンロード
    </a>

  </div>

  <script
    type="module"
    src="app.js"
  ></script>

</body>
</html>
