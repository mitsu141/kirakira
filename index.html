<html lang="ja">
<head>

    <h1>世界の雑学ショートメーカー</h1>

    <section id="input">
      <label for="scriptText"><strong>台本を貼る</strong></label>
      <textarea id="scriptText" rows="8" placeholder="例：フック：この国には驚きの習慣があります。導入：国名はアイスランド。コア：..."></textarea>

      <div class="controls">
        <select id="voiceSelect"></select>
        <button id="generateBtn">生成</button>
        <button id="downloadBtn" disabled>ダウンロード</button>
      </div>
      <div id="progress"></div>
    </section>

    <section id="preview">
      <h2>プレビュー</h2>
      <video id="previewVideo" controls playsinline></video>
      <div id="scenePreviews"></div>
    </section>
